<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓库货架查询</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(190, 141, 90, 0.16), transparent 26%),
        linear-gradient(135deg, #f8efe5 0%, #f3e5d7 46%, #efe0cf 100%);
      color: #2b2018;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
    }
    .page {
      width: 100%;
      max-width: 760px;
    }
    .header {
      text-align: center;
      margin: 10px 0 22px;
    }
    .title {
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.2px;
      margin: 0;
      color: #2a1c13;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(112, 72, 43, 0.12);
      border-radius: 30px;
      box-shadow: 0 22px 60px rgba(96, 58, 32, 0.15);
      padding: 26px;
      backdrop-filter: blur(10px);
    }
    .search-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
    }
    input {
      width: 100%;
      height: 72px;
      border-radius: 22px;
      border: 1.5px solid #71482b;
      background: #fffdf9;
      color: #2b2018;
      font-size: 28px;
      padding: 0 22px;
      outline: none;
      box-shadow: inset 0 0 0 5px rgba(112, 72, 43, 0.06);
    }
    input::placeholder {
      color: #b79f8c;
    }
    input:focus {
      border-color: #5d371f;
      box-shadow: 0 0 0 4px rgba(111, 69, 40, 0.15);
    }
    button {
      height: 72px;
      border: 0;
      border-radius: 22px;
      background: #6b4429;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 16px 28px rgba(91, 54, 30, 0.24);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    button:active {
      transform: translateY(1px);
    }
    .small-actions {
      display: flex;
      justify-content: flex-end;
      margin: 14px 0 0;
      gap: 10px;
    }
    .clear-btn, .refresh-btn {
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(112, 72, 43, 0.22);
      background: #fffaf3;
      color: #6b4429;
      font-size: 15px;
      font-weight: 700;
      box-shadow: none;
    }
    .result {
      min-height: 170px;
      margin-top: 22px;
      border: 1.5px dashed rgba(190, 141, 90, 0.55);
      background: #fff4e4;
      border-radius: 24px;
      padding: 28px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #7a6554;
      font-size: 22px;
      line-height: 1.7;
      white-space: pre-line;
    }
    .result.found {
      background: #fff9f0;
      color: #2b2018;
      border-style: solid;
      align-items: stretch;
      justify-content: flex-start;
      text-align: left;
      flex-direction: column;
      gap: 14px;
      font-size: 20px;
    }
    .result-item {
      padding: 16px 18px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid rgba(112, 72, 43, 0.12);
      box-shadow: 0 8px 20px rgba(80, 48, 28, 0.08);
      font-weight: 800;
    }
    .result-item .index {
      display: inline-block;
      min-width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 999px;
      background: #6b4429;
      color: #fff;
      font-size: 14px;
      margin-right: 8px;
    }
    .status {
      text-align: center;
      font-size: 13px;
      color: #9a806c;
      margin-top: 18px;
    }
    .status strong {
      color: #6b4429;
    }
    .error {
      color: #b04432;
    }
    @media (max-width: 560px) {
      body {
        padding: 18px 10px;
      }
      .card {
        padding: 18px;
        border-radius: 24px;
      }
      .search-row {
        grid-template-columns: 1fr;
      }
      input, button {
        height: 64px;
      }
      input {
        font-size: 24px;
      }
      .result {
        min-height: 150px;
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="title">仓库货架查询</h1>
    </header>

    <section class="card">
      <div class="search-row">
        <input id="codeInput" type="text" inputmode="numeric" autocomplete="off" placeholder="请输入货号..." />
        <button id="queryBtn">查询</button>
      </div>

      <div class="small-actions">
        <button class="refresh-btn" id="refreshBtn" type="button">同步数据</button>
        <button class="clear-btn" id="clearBtn" type="button">清空</button>
      </div>

      <div id="result" class="result">请输入货号后点击查询</div>
      <div id="status" class="status">正在加载线上数据...</div>
    </section>
  </main>

    let inventoryData = EMBEDDED_DATA;
    let dataSource = "内置备用数据";

    const input = document.getElementById("codeInput");
    const result = document.getElementById("result");
    const statusBox = document.getElementById("status");
    const queryBtn = document.getElementById("queryBtn");
    const clearBtn = document.getElementById("clearBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    function setStatus(message, isError = false) {
      statusBox.innerHTML = message;
      statusBox.className = isError ? "status error" : "status";
    }

    async function loadOnlineData(showMessage = false) {
      if (showMessage) setStatus("正在同步线上数据...");
      try {
        const url = DATA_URL + "?t=" + Date.now();
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        inventoryData = data;
        dataSource = "线上同步数据";
        const count = Object.keys(inventoryData).length;
        setStatus(`已使用 <strong>${dataSource}</strong>，共 ${count} 个货号。`);
      } catch (error) {
        inventoryData = EMBEDDED_DATA;
        dataSource = "内置备用数据";
        const count = Object.keys(inventoryData).length;
        setStatus(`线上数据暂时读取失败，已使用 <strong>${dataSource}</strong>，共 ${count} 个货号。`, true);
      }
    }

    function normalizeCode(raw) {
      return (raw || "").trim().replace(/\s+/g, "");
    }

    function findCode(code) {
      if (inventoryData[code]) return inventoryData[code];

      // 兼容用户不输入前导 0 的情况，例如输入 321，也能匹配 0321
      const noLeadingZero = code.replace(/^0+/, "");
      if (noLeadingZero && inventoryData[noLeadingZero]) return inventoryData[noLeadingZero];

      const possibleKey = Object.keys(inventoryData).find(k => k.replace(/^0+/, "") === noLeadingZero);
      if (possibleKey) return inventoryData[possibleKey];

      return null;
    }

    function query() {
      const code = normalizeCode(input.value);

      result.className = "result";

      if (!code) {
        result.textContent = "请输入货号后点击查询";
        return;
      }

      const records = findCode(code);

      if (!records || !records.length) {
        result.textContent = `未查询到货号：${code}`;
        return;
      }

      result.className = "result found";
      result.innerHTML = records.map((item, index) => {
        const text = item.display || [item.floor, item.direction, item.row, item.shelf, item.note].filter(Boolean).join("，");
        return `<div class="result-item"><span class="index">${index + 1}</span>${escapeHtml(text)}</div>`;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    queryBtn.addEventListener("click", query);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") query();
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      result.className = "result";
      result.textContent = "请输入货号后点击查询";
      input.focus();
    });

    refreshBtn.addEventListener("click", () => {
      loadOnlineData(true).then(query);
    });

    loadOnlineData(false);
  </script>
